[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iket-cutedsl"
version = "0.1.0"
description = "Automatic IKET warp-timeline instrumentation for NVIDIA CuTe DSL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = ["nvidia-cutlass-dsl>=4.7,<4.8"]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]

[project.scripts]
iket-cutedsl = "iket_cutedsl.cli:entrypoint"
ncu-iket-collect = "ncu_iket_profile.collect_ncu:entrypoint"
ncu-iket-merge = "ncu_iket_profile.merge:entrypoint"
ncu-iket-preflight = "ncu_iket_profile.preflight:entrypoint"
ncu-iket-validate = "ncu_iket_profile.validate:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
